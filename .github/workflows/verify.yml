name: Vérifier chaque commit

# Every push to main is checked within a minute, with the same gates the automatic edition must pass.
# A commit that breaks one of them turns red at once, instead of surfacing hours later when the next
# edition has already been paid for (16 October 2026: three guides without dated sources, run #46).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install reproducible dependencies
        run: npm ci
      - name: News safeguards
        run: node --test scripts/news-pipeline.test.mjs scripts/cloud-news-edition.test.mjs
      - name: Provenance of every published article
        run: node scripts/ai-wired-crawler.mjs --validate
      - name: Build and audit the whole site
        run: |
          npm run build
          node scripts/audit-build.mjs
